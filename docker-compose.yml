services:
  toolbox-frontend:
    build:
      context: ./frontend
    container_name: toolbox-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://toolbox-backend:8000
      - BACKEND_INTERNAL_URL=http://toolbox-backend:8000
    depends_on:
      - toolbox-backend
    networks:
      - webnet
      - toolbox-internal

  toolbox-backend:
    build:
      context: ./backend
    container_name: toolbox-backend
    restart: unless-stopped
    # Fuer ping/traceroute (ICMP) -- bewusst NUR diese eine Capability,
    # kein --privileged und kein root-User (siehe Dockerfile: laeuft als appuser).
    cap_add:
      - NET_RAW
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://toolbox-redis:6379/0
      - DATABASE_URL=sqlite:////data/toolbox.db
      - DOCKER_PROXY_URL=http://docker-socket-proxy:2375
    volumes:
      - toolbox-db-data:/data
    depends_on:
      - toolbox-redis
    # WICHTIG (Architektur-Aenderung fuer WebSSH): der Backend-Container
    # war bisher AUSSCHLIESSLICH im internen toolbox-internal-Netz --
    # komplett unerreichbar von aussen, selbst von Caddy. Fuer die
    # WebSSH-Webshell (WebSocket, siehe app/api/v1/endpoints/ssh_webshell.py)
    # muss Caddy den Backend-Container DIREKT erreichen koennen, da
    # WebSocket-Upgrades nicht durch die Next.js-BFF-Proxy-Schicht laufen
    # koennen. Deshalb jetzt ZUSAETZLICH auf webnet (das Netz, in dem
    # Caddy laeuft) -- bewusste Abwaegung: das macht den Backend-
    # Container fuer ALLE anderen Container in webnet netzwerktechnisch
    # erreichbar (nicht nur Caddy), falls dort noch weitere, unabhaengige
    # Dienste laufen. Jeder Endpunkt prueft aber weiterhin seine eigene
    # Authentifizierung unabhaengig vom Netzwerkpfad -- die Erreichbarkeit
    # allein reicht nicht fuer Zugriff. Falls das zu weitreichend ist,
    # als Alternative ein eigenes, nur Caddy+Backend umfassendes Netz
    # einrichten (braucht eine Anpassung von Caddys eigener Compose-Datei,
    # die ausserhalb dieses Repos liegt).
    networks:
      - webnet
      - toolbox-internal

  # Read-only Docker-API-Proxy fuer die Dashboard-Container-Uebersicht +
  # gezielten Neustart der eigenen Toolbox-Container.
  # WICHTIG: toolbox-backend bekommt NIEMALS direkten Zugriff auf
  # /var/run/docker.sock (das waere effektiv root auf dem Host). Stattdessen
  # nur dieser Proxy, der den echten Socket read-only mountet.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: toolbox-docker-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - INFO=1
      # KORREKTUR (vorheriger Bug -- "Neustart funktioniert nicht"):
      # ALLOW_RESTARTS ist entgegen einer frueheren Annahme dieser
      # Konfiguration NICHT unabhaengig vom POST-Hauptschalter nutzbar --
      # bestaetigt im aktuellen haproxy.cfg des Projekts (github.com/
      # Tecnativa/docker-socket-proxy) UND in dessen Issue #101
      # "ALLOW_RESTARTS doesn't work": die allererste Regel lautet
      # "http-request deny unless METH_GET || POST", die bei JEDER
      # POST-Anfrage (Restart ist POST) SOFORT greift und die
      # nachfolgende ALLOW_RESTARTS-Regel nie erreicht wird, wenn POST=0
      # ist. POST=1 ist also zwingend Voraussetzung.
      - POST=1
      - ALLOW_RESTARTS=1
      # WICHTIGER SICHERHEITS-HINWEIS (bewusste, transparente Abwaegung):
      # POST=1 in Kombination mit dem bereits aktiven CONTAINERS=1
      # oeffnet auf Proxy-Ebene NICHT NUR den Neustart, sondern
      # technisch auch das Erstellen/Loeschen beliebiger Container
      # (POST /containers/create, DELETE /containers/{id}) -- die
      # CONTAINERS-Regel im Proxy unterscheidet nicht nach HTTP-Methode,
      # nur nach Pfad. Die eigentliche Sicherheitsgrenze liegt deshalb
      # ausschliesslich im BACKEND selbst (siehe TOOLBOX_CONTAINER_NAMES
      # in app/api/v1/endpoints/system.py) -- das Backend ruft niemals
      # Create/Delete auf, aber ein kompromittierter Backend-Container
      # KOENNTE es jetzt technisch tun, was vorher (POST=0) nicht
      # moeglich war. Diese Abwaegung ist notwendig, um den Neustart
      # ueberhaupt funktionsfaehig zu machen -- der zugrunde liegende
      # Proxy bietet keine feinere Kontrolle (kein "POST nur fuer
      # restart, nicht fuer create" moeglich).
      # Alles andere bleibt beim sicheren Default (0): kein EXEC, kein
      # BUILD, keine IMAGES/VOLUMES/NETWORKS/SECRETS/SWARM-Zugriff.
    networks:
      - toolbox-internal
    # Falls der Start auf einem SELinux-Host fehlschlaegt: 'privileged: true'
    # ergaenzen (auf Standard-Ubuntu ohne SELinux nicht noetig).

  # Isolierter Container fuer aktive Scans (Nmap). Bewusst NUR hier die
  # zusaetzlichen Capabilities -- Backend und Frontend bleiben unprivilegiert.
  toolbox-scanner:
    build:
      context: ./scanner
    container_name: toolbox-scanner
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - REDIS_URL=redis://toolbox-redis:6379/0
    depends_on:
      - toolbox-redis
    networks:
      - toolbox-internal

  toolbox-redis:
    image: redis:7-alpine
    container_name: toolbox-redis
    restart: unless-stopped
    volumes:
      - toolbox-redis-data:/data
    networks:
      - toolbox-internal

networks:
  # Bereits vorhandenes externes Netzwerk, in dem Caddy laeuft.
  webnet:
    external: true
  # Internes Netzwerk nur fuer Toolbox-Services, kein Zugriff von aussen.
  toolbox-internal:
    driver: bridge

volumes:
  toolbox-db-data:
  toolbox-redis-data:
